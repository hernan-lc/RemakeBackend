services:
  postgres:
    # pgrust v0.4-beta: Postgres 18.6-compatible engine, drop-in for the
    # official image (same env vars, init scripts, and data volume).
    # Fresh volume required when coming from postgres:17 (PG17 disk format
    # is not reusable here): run `docker compose down -v` once.
    image: malisper/pgrust:v0.4-beta
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: cloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
