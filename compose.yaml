services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: cloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
