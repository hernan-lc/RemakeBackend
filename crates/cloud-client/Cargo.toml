[package]
name = "cloud-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[features]
default = []
system-browser = ["dep:open"]
os-keychain = ["dep:keyring-core", "dep:dbus-secret-service-keyring-store", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]

[dependencies]
cloud-contracts = { path = "../cloud-contracts" }
better-auth = { git = "https://github.com/nglmercer/better-auth-rs.git", rev = "655a1132e8921b4776f52514015cefc3c407e6a6", default-features = false }
base64 = "0.23"
getrandom = "0.2"
sha2 = "0.11"
zeroize = "1"
tokio = { version = "1", features = ["sync", "time"] }
open = { version = "5", optional = true }
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = { version = "1", optional = true }
dbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = { version = "1", optional = true }
apple-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = { version = "1", optional = true }
windows-native-keyring-store = { version = "1", optional = true }
