[package]
name = "devtools"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "remake-dev: one native CLI for RemakeBackend development, database and tests"

[[bin]]
name = "remake-dev"
path = "src/main.rs"

[dependencies]
devtools-core = { path = "../devtools-core" }
anyhow = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
