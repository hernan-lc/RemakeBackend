[package]
name = "cloud-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[dependencies]
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
fs2 = "0.4"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
