[package]
name = "devtools-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Native development tooling for RemakeBackend: pgrust binary and instance management, tests, health and reports"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process", "signal", "sync", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
tempfile = "3"
