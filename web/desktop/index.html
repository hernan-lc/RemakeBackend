<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTools Cloud sign in</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.5 19a4.5 4.5 0 0 0 .4-8.98 6 6 0 0 0-11.7 1.62A4 4 0 0 0 7 19h10.5z"/>
          <path d="M9.5 15.5l2 2 3.5-4"/>
        </svg>
        <h1>TikTools Cloud</h1>
      </div>
      <div class="langselect" id="langselect">
        <button id="lang-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M3.5 12h17M12 3.5c2.5 2.3 3.8 5.2 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5.2-3.8-8.5s1.3-6.2 3.8-8.5z"/>
          </svg>
          <span id="lang-current">English</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <ul id="lang-menu" role="listbox" hidden></ul>
      </div>
    </div>
    <p id="message" role="status">Checking sign-in…</p>
    <p id="account"></p>
    <div class="tabs" id="mode-tabs" hidden>
      <button id="tab-login" type="button">Sign in</button>
      <button id="tab-register" type="button">Create account</button>
    </div>
    <form id="password-form" hidden>
      <div class="field" id="id-field">
        <label for="identifier" data-i18n="identifier">Username or email</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 20c1.2-3.2 3.9-5 7-5s5.8 1.8 7 5"/>
          </svg>
          <input id="identifier" name="identifier" autocomplete="username">
        </div>
      </div>
      <div class="field" id="name-field" hidden>
        <label for="name" data-i18n="name">Display name</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3.2H4a1 1 0 0 0-1 1v5.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/>
            <circle cx="8.5" cy="8.5" r="1.2"/>
          </svg>
          <input id="name" name="name" autocomplete="nickname">
        </div>
      </div>
      <div class="field" id="password-field" hidden>
        <label for="password" data-i18n="password">Password</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button id="password-toggle" type="button" class="peek" aria-pressed="false" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M4 4l16 16"/>
              <path d="M10.6 5.9A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17.6 17.6 0 0 1-3.3 3.9M6.6 6.6C4 8.3 2.5 12 2.5 12S6 18.5 12 18.5c1.5 0 2.9-.4 4.1-1"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
      </div>
      <p id="who" class="who" hidden></p>
      <div class="actions">
        <button id="password-next" type="button" hidden>Continue</button>
        <button id="password-sign-in" type="submit" hidden data-i18n="signIn">Sign in</button>
        <button id="password-back" type="button" hidden class="ghost">Back</button>
      </div>
    </form>
    <div class="actions">
      <button id="sign-in" type="button" hidden>
        <svg class="g" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.7z"/>
          <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.6 2.8v.1C3.5 21.4 7.5 24 12 24z"/>
          <path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.6 0 10.2 0 12s.5 3.4 1.4 4.9l3.8-2.5z"/>
          <path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.6 1.4 6.8l3.8 2.9c1-2.9 3.7-5 6.8-5z"/>
        </svg>
        <span data-i18n="signInGoogle">Sign in with Google</span>
      </button>
      <button id="continue" type="button" hidden data-i18n="continue">Continue to TikTools</button>
      <button id="cancel" type="button" hidden class="ghost" data-i18n="cancel">Cancel</button>
    </div>
  </main>
</body>
</html>
