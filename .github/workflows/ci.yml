name: Rust
on: [push, pull_request]
env:
  CARGO_BUILD_JOBS: 2
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --locked
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check -p cloud-client --all-features --locked
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: malisper/pgrust:v0.4-beta
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 18 archive clients from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<'PGDG'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
      - run: node --test scripts/test-desktop-login.cjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p cloud-client --all-features --locked
      - run: cargo test --workspace --locked -- --ignored --test-threads=1 --skip google_jwks_live_refresh_smoke --skip staging_official_packages_install_with_pinned_client --skip real_clamav_scans_staging_packages
        env:
          CLOUD_TEST_DATABASE_URL: postgres://cloud:test-only@127.0.0.1:5432/cloud_test
  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: malisper/pgrust:v0.4-beta
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cloud_admin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_admin_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cloud:test-only@127.0.0.1:5432/cloud_admin_e2e
      CLOUD_ADMIN_E2E_DATABASE_URL: postgres://cloud:test-only@127.0.0.1:5432/cloud_admin_e2e
      AUTH_SECRET: admin-e2e-only-disposable-auth-secret-2026
      APP_ORIGIN: http://127.0.0.1:5183
      ADMIN_URL: http://127.0.0.1:5183
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install admin dependencies
        working-directory: web/admin
        run: npm ci --ignore-scripts
      - name: Refuse unsafe browser fixture targets
        run: node --test scripts/test-admin-e2e-server.cjs
      - name: Admin unit tests
        working-directory: web/admin
        run: npm test
      - name: Typecheck and build the production admin UI
        working-directory: web/admin
        run: npm run build
      - name: Install Chromium and system dependencies
        working-directory: web/admin
        run: npx playwright install --with-deps chromium
      - name: Build the ordinary API and migrate the disposable database
        run: |
          cargo build --locked -p cloud-api
          target/debug/cloud-api migrate
      - name: Test the built admin UI with real cookie authentication and Origin enforcement
        working-directory: web/admin
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-browser-failure
          path: web/admin/test-results
          if-no-files-found: ignore
          retention-days: 7
  registry-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nglmercer/TikTools-app
          ref: 983a375c5b702681a791061ca863cea9c542528d
          path: tiktools-upstream
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify upstream registry client and signing CLI
        working-directory: tiktools-upstream
        run: |
          cargo test --locked -p tiktools-plugin-registry signed_registry_round_trip_with_search_download_and_cache
          cargo test --locked -p tiktools-plugin-registry tampered_documents_and_unknown_roots_are_rejected
          cargo test --locked -p tiktools-plugin-devkit scaffold_pack_sign_and_publish_to_a_static_registry
      - name: Build disposable registry fixture
        run: scripts/build-registry-fixture.sh tiktools-upstream "$RUNNER_TEMP/registry-fixture"
      - name: Verify generated fixture with pinned TikTools client
        run: scripts/verify-registry-fixture.sh tiktools-upstream "$RUNNER_TEMP/registry-fixture" "$RUNNER_TEMP/registry-fixture.root-pin.json"
      - name: Verify fixture with Cloud package verifier
        run: cargo run --locked -p cloud-verifier --example verify_fixture -- "$RUNNER_TEMP/registry-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-signed-registry-fixture
          path: |
            ${{ runner.temp }}/registry-fixture
            ${{ runner.temp }}/registry-fixture.root-pin.json
          if-no-files-found: error
          retention-days: 7
