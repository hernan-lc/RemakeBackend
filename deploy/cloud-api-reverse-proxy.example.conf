# Example nginx reverse proxy: API-only HTTPS origin for Desktop native clients.
#
# Use this when the backend serves Desktop apps directly without the admin UI.
# (For the combined admin UI + API origin, see
# admin-reverse-proxy.example.conf instead.) Copy to /etc/nginx/conf.d/ and
# replace api.example.test, the certificate paths, and the upstream address.
# This file is an example, not a live config.
#
# Secrets policy: only TLS material lives here. AUTH_SECRET, DATABASE_URL,
# GOOGLE_CLIENT_SECRET, storage keys, and SNAPSHOT_* trust files live in the
# backend environment or on the backend host, NEVER in this file.

upstream cloud_api {
    server 127.0.0.1:3000;
    # The API holds no server-side session affinity; add more upstreams only
    # behind shared Better Auth storage so social-login rate limits stay
    # global. Keep one ClamAV daemon per backend host (CLAMAV_ADDR is
    # loopback-only by backend validation).
}

# Plain HTTP exists only to redirect. The backend never serves API traffic
# on port 80 and APP_ORIGIN must be the https:// origin below.
server {
    listen 80;
    server_name api.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.test;

    ssl_certificate     /etc/nginx/tls/api.example.test.crt;
    ssl_certificate_key /etc/nginx/tls/api.example.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # V1 metadata is 2-4 KiB; v2 portable documents allow 256 KiB.
    # package bytes travel directly between the publisher and versioned
    # object storage via presigned URLs, never through this proxy.
    client_max_body_size 260k;

    # Registry generation files are immutable per generation. The backend
    # marks them immutable; the proxy repeats a long cache so update polls
    # hit the edge instead of the API on every Desktop refresh.
    location ~ ^/api/v1/registry/generations/\d+/files/ {
        proxy_pass http://cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The backend sets no-store per route; repeat it so a backend
        # regression cannot start caching auth, sync, or moderation data.
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Backend alignment checklist:
    # - APP_ORIGIN=https://api.example.test (loopback HTTP is rejected).
    # - TRUSTED_PROXY_CIDRS must cover this proxy's egress IP, otherwise the
    #   proxy boundary strips X-Forwarded-For and rate limiting sees only the
    #   proxy peer address.
    # - HSTS is emitted by the backend itself when APP_ORIGIN is https.
    # - /health/live and /health/ready are the load-balancer checks;
    #   readiness already verifies applied migrations and required schema.
}
