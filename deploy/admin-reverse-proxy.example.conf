# Example nginx reverse proxy: single HTTPS origin for the admin UI and API.
#
# Production puts the built UI (web/admin/dist) and the Rust backend on ONE
# HTTPS origin so cookies stay same-origin and no CORS is needed. Copy to
# /etc/nginx/conf.d/ and replace admin.example.test, the certificate paths,
# and the upstream address. This file is an example, not a live config.
#
# Secrets policy: only TLS material lives here. AUTH_SECRET, DATABASE_URL,
# GOOGLE_CLIENT_SECRET, and storage keys live in the backend environment
# (see .env.example) and NEVER in the UI build or any Vite env var.

upstream cloud_api {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name admin.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.test;

    ssl_certificate     /etc/nginx/tls/admin.example.test.crt;
    ssl_certificate_key /etc/nginx/tls/admin.example.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow bounded v2 template/profile documents through to the API.
    client_max_body_size 260k;

    root /var/www/tiktools-admin/dist;
    index index.html;

    # Static UI. Vue Router owns /app/* client-side.
    location / {
        try_files $uri $uri/ /index.html;
        # Fingerprinted assets are immutable; index.html is not cached.
        location ~* \.(js|css|woff2?)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Backend API + Better Auth. no-store is also set by the backend itself;
    # the proxy repeats it so a backend regression cannot start caching auth.
    location /api/ {
        proxy_pass http://cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # APP_ORIGIN on the backend MUST be https://admin.example.test or cookie
    # Domain/Secure checks and CSRF origin checks will reject browser logins.
    # TRUSTED_PROXY_CIDRS must cover this proxy, otherwise forwarded-IP
    # rate limiting falls back to the proxy peer address.
}
